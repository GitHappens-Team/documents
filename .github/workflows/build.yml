name: Build documenti

on:
  push:
  pull_request:
  workflow_dispatch:

# One publish at a time, so two pushes can't race on the website repo.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find .tex docs
        id: find
        run: |
          echo "dirs=$(find . -name main.tex -not -path './.latex/*' -printf '%h\n' | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # Output mirrors the website's content/ folder:
      #   <group>/<sub...>/<doc>/main.tex  ->  out/content/<group>/<sub...>/<doc>/<doc>.pdf
      # The PDF is named after its folder (the site derives the card title from the
      # file name), and an optional metadata.json next to main.tex is copied beside it:
      #   { "title": "...", "description": "..." }
      - name: Compila
        run: |
          mkdir -p out/content
          for d in ${{ steps.find.outputs.dirs }}; do
            rel="${d#./}"
            name="$(basename "$rel")"
            docker run --rm -v "$PWD:/work" -w "/work/$d" \
              -e TEXINPUTS=/work/.latex//: \
              texlive/texlive:latest \
              latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
            mkdir -p "out/content/$rel"
            cp "$d/main.pdf" "out/content/$rel/$name.pdf"
            if [ -f "$d/metadata.json" ]; then
              cp "$d/metadata.json" "out/content/$rel/metadata.json"
            fi
          done

      - name: Show result
        run: find out/content -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out/content
          if-no-files-found: error

  # Only the main branch publishes; PRs just prove that everything compiles.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Repo variable, e.g. GitHappens-Team/website
      WEBSITE_REPO: ${{ vars.WEBSITE_REPO }}
    steps:
      - name: Check configuration
        run: |
          [ -n "$WEBSITE_REPO" ] || { echo "::error::Set the WEBSITE_REPO repository variable (owner/name of the website repo)"; exit 1; }
          [ -n "${{ secrets.WEBSITE_DEPLOY_KEY }}" ] || { echo "::error::Set the WEBSITE_DEPLOY_KEY secret (private half of a deploy key with write access on the website repo)"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: content
          path: built

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.WEBSITE_REPO }}
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          ref: main
          path: website

      # --delete drops PDFs whose source document is gone; .gitkeep and the
      # generated manifest.json belong to the website repo and are left alone.
      - name: Sync content
        run: |
          rsync -a --delete \
            --exclude '.gitkeep' --exclude 'manifest.json' \
            built/ website/content/

      - name: Commit and push
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to publish."
            exit 0
          fi
          git commit -m "docs: update content from ${{ github.repository }}@${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
