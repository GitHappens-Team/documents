name: Glossary full check

# Run by hand (Actions > Glossary full check > Run workflow): checks every
# document and writes the result to the job summary.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Glossary check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 .github/scripts/glossary_suggestions.py full
